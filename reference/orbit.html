<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17121f"><title>Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3f1fa;--card:#fff;--c2:#e9e6f5;--tx:#1b1526;--mu:#6f6a85;--a1:#ff6a33;--a2:#6a73ff;--a3:#12b886;--ln:#1b152614;--sh:#3a2a7a30;--pg:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121f;--card:#221a2e;--c2:#2d2442;--tx:#f5f1ff;--mu:#9d93b8;--a1:#ff7a45;--a2:#8f9bff;--a3:#5ee0b5;--ln:#ffffff14;--sh:#0009}}
:root[data-theme="dark"]{--bg:#17121f;--card:#221a2e;--c2:#2d2442;--tx:#f5f1ff;--mu:#9d93b8;--a1:#ff7a45;--a2:#8f9bff;--a3:#5ee0b5;--ln:#ffffff14;--sh:#0009}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:500 15px/1.35 'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 10% 0%,var(--a1),transparent 70%),radial-gradient(60% 45% at 100% 25%,var(--a2),transparent 70%);opacity:calc(.12 + var(--pg)*.3);transition:opacity .8s}
#app{position:relative;max-width:520px;margin:auto;padding:18px 16px 130px}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}svg.i{display:block;flex:none}
h1{font-size:34px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}.top small{color:var(--mu);display:block;margin-bottom:5px}
.card,.row,.hc,.orb,.sc div,.heat{background:linear-gradient(155deg,color-mix(in srgb,var(--card) 92%,#fff),var(--card));border:1px solid var(--ln);box-shadow:0 14px 30px -18px var(--sh)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wk button{padding:9px 0;border-radius:18px;background:var(--card);border:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu)}
.wk b{font-size:16px;color:var(--tx)}.wk .on{background:var(--tx);color:var(--bg)}.wk .on b{color:var(--bg)}
.wk i{width:5px;height:5px;border-radius:9px;background:var(--a3);opacity:0}.wk .ok i{opacity:1}
.orb{display:flex;align-items:center;gap:10px;border-radius:38px;padding:16px 18px 16px 10px;margin-bottom:20px}
.orb svg{width:172px;flex:none;overflow:visible}.orb .r{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.orb.full svg{filter:drop-shadow(0 0 12px var(--a1))}.orb text{font-family:inherit;fill:var(--tx);font-weight:800;text-anchor:middle}
.lg{flex:1;display:grid;gap:14px}.lg div{display:flex;align-items:center;gap:10px}.lg i{width:11px;height:11px;border-radius:9px;flex:none}.lg b{display:block;font-size:18px;line-height:1}.lg small{color:var(--mu)}
h3{font-size:17px;font-weight:800;margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}h3 span{color:var(--mu);font-weight:500;font-size:14px}
.row{--c:var(--a2);display:flex;align-items:center;gap:12px;border-radius:24px;padding:10px 14px 10px 10px;margin-bottom:9px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 9%,var(--card)),var(--card))}
.row.p2{--c:var(--a1)}.row.p1{--c:var(--a2)}.row.p0{--c:var(--mu)}
.g{flex:1;min-width:0;cursor:pointer}.g b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}.g small{color:var(--mu);display:flex;gap:12px;flex-wrap:wrap;align-items:center}.late{color:var(--a1)!important}
.fl{display:inline-flex;align-items:center;gap:4px}.fl svg{color:var(--a1)}
.dn .g b{text-decoration:line-through;color:var(--mu)}
.tile{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 17%,transparent)}
.bx{width:34px;height:34px;border-radius:12px;border:2px solid color-mix(in srgb,var(--c) 65%,transparent);display:grid;place-items:center;color:var(--bg);flex:none;transition:background .2s}
.bx.sq{width:28px;height:28px;border-radius:9px;margin:9px 8px 9px 9px}.bx.on{background:var(--c);border-color:var(--c)}.bx.lock{opacity:.4}
.bx path{stroke-dasharray:24;stroke-dashoffset:24}.on path{stroke-dashoffset:0}.pop{animation:pop .35s}.pop path{animation:draw .4s}@keyframes pop{50%{transform:scale(1.2)}}@keyframes draw{from{stroke-dashoffset:24}}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--ln);white-space:nowrap;flex:none}.chip.on{background:var(--tx);color:var(--bg)}
.hc{border-radius:28px;padding:16px;margin-bottom:12px;--c:var(--a2);background:linear-gradient(150deg,color-mix(in srgb,var(--c) 10%,var(--card)),var(--card))}
.hc .hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}.hc .g b{font-size:17px}
.wc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;color:var(--mu);font-size:12px}
.wc button,.wc .c{height:40px;margin-top:5px;border-radius:14px;background:var(--c2);display:grid;place-items:center;color:var(--bg);width:100%}
.wc .on{background:var(--c)}.wc .off{opacity:.3}.wc .fu{opacity:.5}.wc .td{outline:2px solid var(--c);outline-offset:2px}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:16px}.hm i{aspect-ratio:1;border-radius:4px}
.hn{color:var(--mu);font-size:12px;margin-top:8px}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}.sc div{border-radius:24px;padding:15px}.sc b{font-size:30px;font-weight:800;letter-spacing:-1px;display:block;line-height:1}.sc small{color:var(--mu)}
.chart{border-radius:28px;padding:14px 12px 8px;background:var(--card);border:1px solid var(--ln);box-shadow:0 14px 30px -18px var(--sh)}.chart svg{width:100%;display:block}.chart text{fill:var(--mu);font:11px 'Bricolage Grotesque',system-ui,sans-serif}
.br{display:flex;align-items:center;gap:12px;margin-bottom:12px}.br .tile{width:38px;height:38px;border-radius:13px}.br .bt{flex:1;height:9px;border-radius:9px;background:var(--c2);overflow:hidden}.br .bt i{display:block;height:100%;border-radius:9px;background:var(--c)}.br b{width:42px;text-align:right}
.bk{width:100%;border-radius:16px;border:1px solid var(--ln);background:var(--card);padding:10px;margin:8px 0;height:70px;resize:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 16px;border-radius:99px;background:var(--card);border:1px solid var(--ln)}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;padding:6px;border-radius:99px;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--ln);box-shadow:0 14px 44px -8px var(--sh);z-index:5}
nav button{width:58px;height:52px;border-radius:99px;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}nav .on{color:var(--tx);background:var(--c2)}
nav .fab{width:56px;height:56px;margin:0 6px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;box-shadow:0 8px 20px -6px var(--a1)}
.scrim{position:fixed;inset:0;background:#0007;z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--card);border-radius:32px 32px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:9;animation:up .25s;max-height:90vh;overflow:auto;border:1px solid var(--ln)}@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--c2);margin:0 auto 12px}
.sheet input{width:100%;background:var(--c2);border:0;border-radius:16px;padding:14px;margin-bottom:12px;font-size:17px}
.sheet .l{color:var(--mu);font-size:13px;margin:4px 2px 6px}
.seg{display:flex;background:var(--c2);border-radius:16px;padding:4px;margin-bottom:12px}.seg button{flex:1;padding:9px;border-radius:12px;color:var(--mu)}.seg .on{background:var(--tx);color:var(--bg)}
.sw{display:flex;gap:10px;margin-bottom:12px}.sw button{width:36px;height:36px;border-radius:99px;border:3px solid transparent}.sw .on{border-color:var(--tx)}
.ig{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.ig button{height:46px;border-radius:14px;background:var(--c2);display:grid;place-items:center;color:var(--mu)}.ig .on{background:var(--tx);color:var(--bg)}
.dys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.dys button{height:38px;border-radius:12px;background:var(--c2);color:var(--mu)}.dys .on{background:var(--a1);color:#fff}
.acts{display:flex;gap:10px;margin-top:6px}.pri{flex:1;padding:15px;border-radius:18px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:800;font-size:16px}.ghost{padding:15px 20px;border-radius:18px;background:var(--c2);color:var(--a1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div><nav id="nv"></nav><div id="sh"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),TD=()=>K(new Date());
const D=k=>{const a=k.split('-');return new Date(+a[0],a[1]-1,+a[2])},add=(k,n)=>{const d=D(k);d.setDate(d.getDate()+n);return K(d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={drop:'<path d="M12 3s6 6.2 6 10.5A6 6 0 0 1 6 13.5C6 9.2 12 3 12 3z"/>',dumb:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',code:'<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5v16"/>',moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',heart:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',leaf:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l7-7"/>',cup:'<path d="M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>',pen:'<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19zM14 7l3 3"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',music:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/>',flame:'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .5 1.5 1.5 2 2 2 0-3-1-5 1-8z"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',plus:'<path d="M12 5v14M5 12h14"/>',orb:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',task:'<rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',loop:'<path d="M4 11a8 8 0 0 1 14-4l2 2M20 4v5h-5M20 13a8 8 0 0 1-14 4l-2-2M4 20v-5h5"/>',bars:'<path d="M5 20v-7M12 20V5M19 20v-10"/>'};
const ic=(n,s=20,w=1.8)=>`<svg class="i" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]||P.bolt}</svg>`;
const IL=['drop','dumb','code','book','moon','bolt','heart','leaf','cup','pen','sun','music'],COL=['#ff7a45','#ff5c93','#5cc8ff','#ffb938','#8f9bff','#3ddc97'],WD=['S','M','T','W','T','F','S'],ORD=[1,2,3,4,5,6,0];
let S={tasks:[],habits:[]};
try{const r=JSON.parse(localStorage.getItem('orbit')||'null');if(r&&r.tasks)S=r}catch(e){}
if(!S.seeded){S.seeded=1;S.habits=[{id:uid(),n:'Drink 3L water',i:'drop',c:COL[2],days:[0,1,2,3,4,5,6],log:{}},{id:uid(),n:'Gym',i:'dumb',c:COL[0],days:[1,2,3,4,5,6],log:{}},{id:uid(),n:'Code 1 hour',i:'code',c:COL[4],days:[0,1,2,3,4,5,6],log:{}}];S.tasks=[{id:uid(),t:'Tap me to edit, + to add',p:1,d:TD(),tag:'welcome',done:0,at:''}]}
const gi=n=>/water/i.test(n)?'drop':/gym|workout|lift/i.test(n)?'dumb':/code|dev/i.test(n)?'code':/read|book/i.test(n)?'book':/sleep/i.test(n)?'moon':'bolt';
S.habits.forEach(h=>{if(!h.i)h.i=gi(h.n)});
const sv=()=>{try{localStorage.setItem('orbit',JSON.stringify(S))}catch(e){}};
try{const t=localStorage.getItem('orbit-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
let tab='today',sel=TD(),flt='open',pop='',ani=true,sh=null,rng=30;
const vib=()=>{try{navigator.vibrate(12)}catch(e){}};
$('#nv').innerHTML=[['today','orb','Today'],['tasks','task','Tasks'],['new','plus'],['habits','loop','Habits'],['stats','bars','Stats']].map(n=>n[0]==='new'?`<button class="fab" data-a="new">${ic('plus',26,2.2)}</button>`:`<button data-a="nav" data-v="${n[0]}">${ic(n[1],21)}${n[2]}</button>`).join('');
const due=(h,k)=>h.days.includes(D(k).getDay());
function streak(h){let s=0,t=TD();for(let i=0;i<400;i++){const k=add(t,-i);if(!due(h,k))continue;if(h.log[k])s++;else if(i>0)break}return s}
function best(h){let b=0,c=0,t=TD();for(let i=365;i>=0;i--){const k=add(t,-i);if(!due(h,k))continue;if(h.log[k]){c++;b=Math.max(b,c)}else if(i>0)c=0}return b}
const tasksFor=k=>S.tasks.filter(t=>t.d===k||(k===TD()&&!t.done&&(!t.d||t.d<k))||(t.done&&t.at===k)).sort((a,b)=>a.done-b.done||b.p-a.p);
function dl(d){if(!d)return'';const t=TD();if(d===t)return'Today';if(d===add(t,1))return'Tomorrow';if(d===add(t,-1))return'Yesterday';return D(d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
const ring=(r,p,g)=>{const C=2*Math.PI*r;return`<circle cx="100" cy="100" r="${r}" fill="none" stroke="var(--c2)" stroke-width="12"/><circle class="r" cx="100" cy="100" r="${r}" fill="none" stroke="url(#${g})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${ani?C:C*(1-p)}" data-o="${C*(1-p)}" transform="rotate(-90 100 100)"/>`};
const grad=(id,a,b)=>`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(${a})"/><stop offset="1" style="stop-color:var(${b})"/></linearGradient>`;
const trow=t=>`<div class="row p${t.p} ${t.done?'dn':''}"><button class="bx sq ${t.done?'on':''} ${pop===t.id?'pop':''}" data-a="tt" data-id="${t.id}">${ic('check',16,2.8)}</button><div class="g" data-a="et" data-id="${t.id}"><b>${esc(t.t)}</b><small>${t.d?`<span class="${!t.done&&t.d<TD()?'late':''}">${dl(t.d)}</span>`:''}${t.tag?`<span>#${esc(t.tag)}</span>`:''}</small></div></div>`;
const hrow=h=>{const ok=sel===TD();return`<div class="row" style="--c:${h.c}"><span class="tile">${ic(h.i,22)}</span><div class="g" data-a="eh" data-id="${h.id}"><b>${esc(h.n)}</b><small><span class="fl">${ic('flame',14)}${streak(h)} day streak</span></small></div><button class="bx ${h.log[sel]?'on':''} ${ok?'':'lock'} ${pop===h.id?'pop':''}" ${ok?`data-a="th" data-id="${h.id}"`:'disabled'}>${ic('check',18,2.8)}</button></div>`};
function vToday(){
 const hs=S.habits.filter(h=>due(h,sel)),ts=tasksFor(sel),hd=hs.filter(h=>h.log[sel]).length,td=ts.filter(t=>t.done).length;
 const hp=hs.length?hd/hs.length:0,tp=ts.length?td/ts.length:0,tot=hs.length+ts.length,op=tot?(hd+td)/tot:0;
 document.documentElement.style.setProperty('--pg',op);
 const d=D(sel),h=new Date().getHours(),off=(d.getDay()+6)%7;
 let wk='';for(let i=0;i<7;i++){const k=add(sel,i-off),hh=S.habits.filter(x=>due(x,k)),ok=hh.length&&hh.every(x=>x.log[k]);wk+=`<button class="${k===sel?'on':''} ${ok?'ok':''}" data-a="day" data-v="${k}">${'MTWTFSS'[i]}<b>${D(k).getDate()}</b><i></i></button>`}
 return`<div class="top"><div><small>${sel===TD()?(h<12?'Good morning':h<17?'Good afternoon':'Good evening'):'Viewing'}</small><h1>${d.toLocaleDateString('en-IN',{weekday:'long'})},<br>${d.toLocaleDateString('en-IN',{day:'numeric',month:'long'})}</h1></div></div><div class="wk">${wk}</div>
 <div class="orb ${op===1&&tot?'full':''}"><svg viewBox="0 0 200 200"><defs>${grad('g1','--a1','--a2')}${grad('g2','--a2','--a3')}${grad('g3','--a3','--a1')}</defs><circle cx="100" cy="100" r="98" fill="none" stroke="var(--mu)" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round" opacity=".5"/>${ring(86,op,'g1')}${ring(67,tp,'g2')}${ring(48,hp,'g3')}<text x="100" y="109" font-size="26">${Math.round(op*100)}%</text></svg>
 <div class="lg"><div><i style="background:var(--a1)"></i><span><b>${hd+td}/${tot}</b><small>everything</small></span></div><div><i style="background:var(--a2)"></i><span><b>${td}/${ts.length}</b><small>tasks</small></span></div><div><i style="background:var(--a3)"></i><span><b>${hd}/${hs.length}</b><small>habits</small></span></div></div></div>
 ${hs.length?`<h3>Habits <span>${hd} of ${hs.length}</span></h3>${hs.map(hrow).join('')}`:''}${ts.length?`<h3>Tasks <span>${td} of ${ts.length}</span></h3>${ts.map(trow).join('')}`:''}
 ${tot?'':'<div class="empty">Nothing planned for this day.<br>Tap + to add a task or habit.</div>'}`}
function vTasks(){
 const t=TD();let L=S.tasks.filter(x=>flt==='done'?x.done:!x.done&&(flt==='open'||(flt==='today'&&(!x.d||x.d<=t))||(flt==='up'&&x.d>t)));
 L.sort((a,b)=>(a.d||'9')<(b.d||'9')?-1:(a.d||'9')>(b.d||'9')?1:b.p-a.p);
 return`<div class="top"><h1>Tasks</h1></div><div class="chips">${[['open','All open'],['today','Today'],['up','Upcoming'],['done','Done']].map(f=>`<button class="chip ${flt===f[0]?'on':''}" data-a="flt" data-v="${f[0]}">${f[1]}</button>`).join('')}</div>${L.length?L.map(trow).join(''):'<div class="empty">No tasks here.</div>'}`}
function heat(h){const t=TD(),off=(D(t).getDay()+6)%7,st=add(t,-off-17*7);let c='',n=0;
 for(let i=0;i<126;i++){const k=add(st,i);if(k>t)break;if(h.log[k]){n++;c+='<i style="background:var(--c)"></i>'}else c+=`<i style="background:var(--c2);opacity:${due(h,k)?1:.3}"></i>`}
 return`<div class="hm">${c}</div><div class="hn">${n} days done in the last 18 weeks</div>`}
function vHabits(){
 const t=TD(),off=(D(t).getDay()+6)%7,ws=add(t,-off);
 return`<div class="top"><h1>Habits</h1></div>${S.habits.length?S.habits.map(h=>{let w='';for(let i=0;i<7;i++){const k=add(ws,i),dn=h.log[k],cl=`${dn?'on':''} ${k>t?'fu':''} ${due(h,k)?'':'off'}`;
  w+=`<div>${'MTWTFSS'[i]}${k===t?`<button class="td ${cl}" data-a="th" data-id="${h.id}">${dn?ic('check',18,2.8):''}</button>`:`<div class="c ${cl}">${dn?ic('check',16,2.8):''}</div>`}</div>`}
  return`<div class="hc" style="--c:${h.c}"><div class="hd"><span class="tile">${ic(h.i,22)}</span><div class="g" data-a="eh" data-id="${h.id}"><b>${esc(h.n)}</b><small><span class="fl">${ic('flame',14)}${streak(h)} now</span><span>best ${best(h)}</span></small></div></div><div class="wc">${w}</div>${heat(h)}</div>`}).join(''):'<div class="empty">No habits yet. Tap + to start one.</div>'}`}
const sm=p=>{let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d};
function vStats(){
 const t=TD(),W=340,H=170,L=30,R=8,T=10,B=24,pts=[],rate={};let dn=0,dd=0;
 S.habits.forEach(h=>rate[h.id]=[0,0]);
 for(let i=0;i<rng;i++){const k=add(t,i-rng+1);let a=0,b=0;S.habits.forEach(h=>{if(due(h,k)){b++;rate[h.id][1]++;if(h.log[k]){a++;rate[h.id][0]++}}});dn+=a;dd+=b;
  pts.push([L+(W-L-R)*(rng>1?i/(rng-1):0),T+(H-T-B)*(1-(b?a/b:0)),b?a/b:0])}
 const y=v=>T+(H-T-B)*(1-v),line=pts.length>1?sm(pts):'',lp=pts[pts.length-1];
 const chart=S.habits.length?`<svg viewBox="0 0 ${W} ${H}"><defs>${grad('lg','--a1','--a2')}<linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a1);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--a2);stop-opacity:0"/></linearGradient></defs>
 ${[0,.5,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--ln)" stroke-dasharray="3 5"/><text x="0" y="${y(v)+4}">${v*100}%</text>`).join('')}
 <path d="${line}L${lp[0]},${y(0)}L${L},${y(0)}Z" fill="url(#ar)"/><path d="${line}" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/><circle cx="${lp[0]}" cy="${lp[1]}" r="5" fill="var(--a1)" stroke="var(--card)" stroke-width="2.5"/>
 <text x="${L}" y="${H-5}">${dl(add(t,1-rng))||''}</text><text x="${W-R}" y="${H-5}" text-anchor="end">Today</text></svg>`:'<div class="empty">Add habits to see analytics.</div>';
 return`<div class="top"><h1>Stats</h1></div><div class="chips">${[7,30,90].map(n=>`<button class="chip ${rng===n?'on':''}" data-a="rg" data-v="${n}">${n} days</button>`).join('')}</div>
 <div class="chart">${chart}</div><h3>Habit completion <span>all habits combined</span></h3>
 <div class="sc"><div><b>${dd?Math.round(dn/dd*100):0}%</b><small>average</small></div><div><b>${Math.max(0,...S.habits.map(best))}</b><small>longest streak</small></div><div><b>${S.tasks.filter(x=>x.done).length}</b><small>tasks done</small></div><div><b>${S.habits.length}</b><small>active habits</small></div></div>
 <h3>By habit <span>last ${rng} days</span></h3>${S.habits.map(h=>{const r=rate[h.id],p=r[1]?Math.round(r[0]/r[1]*100):0;return`<div class="br" style="--c:${h.c}"><span class="tile">${ic(h.i,18)}</span><div style="flex:1"><div style="margin-bottom:5px;font-weight:600">${esc(h.n)}</div><div class="bt"><i style="width:${p}%"></i></div></div><b>${p}%</b></div>`}).join('')}
 <h3>Data</h3><div class="btns"><button class="btn" data-a="bk">Backup</button><button class="btn" data-a="rs">Restore</button><button class="btn" data-a="th2">Switch theme</button></div><textarea id="bkt" class="bk" placeholder="Tap Backup and copy this text. To restore, paste it here and tap Restore."></textarea><small style="color:var(--mu)">Data lives only in this browser. Back up before clearing site data.</small>`}
function render(){
 $('#app').innerHTML={today:vToday,tasks:vTasks,habits:vHabits,stats:vStats}[tab]();
 document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
 if(ani){ani=false;requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.r').forEach(c=>c.setAttribute('stroke-dashoffset',c.dataset.o))))}
 pop='';
}
function sheet(){
 if(!sh){$('#sh').innerHTML='';return}
 const T=sh.type==='t';
 $('#sh').innerHTML=`<div class="scrim" data-a="x"></div><div class="sheet"><div class="grab"></div>${sh.id?'':`<div class="seg"><button class="${T?'on':''}" data-a="ty" data-v="t">Task</button><button class="${T?'':'on'}" data-a="ty" data-v="h">Habit</button></div>`}
 <input id="nm" maxlength="80" placeholder="${T?'What needs doing?':'Name your habit'}" value="${esc(sh.n)}">
 ${T?`<div class="l">Priority</div><div class="seg">${['Low','Medium','High'].map((x,i)=>`<button class="${sh.p===i?'on':''}" data-a="pr" data-v="${i}">${x}</button>`).join('')}</div>
 <div class="l">Due</div><div class="chips"><button class="chip" data-a="dd" data-v="0">Today</button><button class="chip" data-a="dd" data-v="1">Tomorrow</button><button class="chip" data-a="dd" data-v="7">Next week</button><button class="chip" data-a="dd" data-v="">No date</button></div><input id="dt" type="date" value="${sh.d}"><input id="tg" placeholder="Tag (work, gym, college)" value="${esc(sh.tag)}">`
 :`<div class="l">Icon</div><div class="ig">${IL.map(n=>`<button class="${sh.i===n?'on':''}" data-a="ic" data-v="${n}">${ic(n,22)}</button>`).join('')}</div><div class="l">Colour</div><div class="sw">${COL.map(c=>`<button class="${sh.c===c?'on':''}" style="background:${c}" data-a="cl" data-v="${c}"></button>`).join('')}</div><div class="l">Repeats on</div><div class="dys">${ORD.map(i=>`<button class="${sh.days.includes(i)?'on':''}" data-a="wd" data-v="${i}">${WD[i]}</button>`).join('')}</div>`}
 <div class="acts">${sh.id?'<button class="ghost" data-a="del">Delete</button>':''}<button class="pri" data-a="save">Save</button></div></div>`;
}
function open(type,id){const it=id&&(type==='t'?S.tasks:S.habits).find(x=>x.id===id);sh={type,id:id||'',n:it?(it.t||it.n):'',p:it?it.p:1,d:it?it.d:(tab==='today'?sel:''),tag:it?it.tag||'':'',i:it?it.i:'bolt',c:it?it.c:COL[0],days:it?[...it.days]:[0,1,2,3,4,5,6]};sheet();setTimeout(()=>{if(!id)$('#nm').focus()},50)}
const one=b=>b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
 const hab=()=>S.habits.find(x=>x.id===id),tsk=()=>S.tasks.find(x=>x.id===id);
 if(a==='nav'){tab=v;ani=tab==='today';render();scrollTo(0,0)}
 else if(a==='day'){sel=v;ani=true;render()}
 else if(a==='flt'){flt=v;render()}
 else if(a==='rg'){rng=+v;render()}
 else if(a==='th'){const h=hab(),k=TD();h.log[k]?delete h.log[k]:h.log[k]=1;pop=id;vib();sv();render()}
 else if(a==='tt'){const t=tsk();t.done=t.done?0:1;t.at=t.done?TD():'';pop=id;vib();sv();render()}
 else if(a==='eh')open('h',id);else if(a==='et')open('t',id);
 else if(a==='new')open(tab==='habits'?'h':'t');
 else if(a==='x'){sh=null;sheet()}
 else if(a==='ty'){sh.n=$('#nm').value;sh.type=v;sheet()}
 else if(a==='pr'){sh.p=+v;one(b)}
 else if(a==='cl'){sh.c=v;one(b)}
 else if(a==='ic'){sh.i=v;one(b)}
 else if(a==='wd'){const i=+v;sh.days=sh.days.includes(i)?sh.days.filter(x=>x!==i):[...sh.days,i];b.classList.toggle('on')}
 else if(a==='dd'){$('#dt').value=v===''?'':add(TD(),+v)}
 else if(a==='save'){const n=$('#nm').value.trim();if(!n){$('#nm').focus();return}
  if(sh.type==='t'){const o={t:n,p:sh.p,d:$('#dt').value,tag:$('#tg').value.trim().replace(/^#/,'')};sh.id?Object.assign(S.tasks.find(x=>x.id===sh.id),o):S.tasks.push({id:uid(),done:0,at:'',...o})}
  else{const o={n,i:sh.i,c:sh.c,days:sh.days.length?sh.days:[0,1,2,3,4,5,6]};sh.id?Object.assign(S.habits.find(x=>x.id===sh.id),o):S.habits.push({id:uid(),log:{},...o})}
  sh=null;sheet();sv();render()}
 else if(a==='del'){if(sh.type==='t')S.tasks=S.tasks.filter(x=>x.id!==sh.id);else S.habits=S.habits.filter(x=>x.id!==sh.id);sh=null;sheet();sv();render()}
 else if(a==='bk'){const t=$('#bkt');t.value=JSON.stringify(S);t.select();try{document.execCommand('copy')}catch(e){}}
 else if(a==='rs'){try{const r=JSON.parse($('#bkt').value);if(r&&r.tasks&&r.habits){S=r;S.habits.forEach(h=>{if(!h.i)h.i=gi(h.n)});sv();ani=true;render()}}catch(e){$('#bkt').value='That is not valid backup text.'}}
 else if(a==='th2'){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()==='#17121f',n=dk?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('orbit-theme',n)}catch(e){}}
});
render();
</script></body></html>
